name: Release

# Push a tag like v0.1.0 to build qalam.exe and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/qalam.exe dist/qalam.exe
          Compress-Archive -Path dist/qalam.exe, README.md, LICENSE -DestinationPath "dist/qalam-${{ github.ref_name }}-windows-x64.zip"
          Get-FileHash dist/* -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist/SHA256SUMS.txt
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/qalam.exe "dist/qalam-${{ github.ref_name }}-windows-x64.zip" dist/SHA256SUMS.txt --title "qalam ${{ github.ref_name }}" --generate-notes
