[package]
name = "qalam"
version = "0.1.6"
edition = "2024"
build = "build.rs"
description = "System-wide word suggestions, autocorrect, spell-check and text replacement for Windows"
license = "MIT"
repository = "https://github.com/watdafawx/qalam"

[lib]
path = "src/lib.rs"

[[bin]]
name = "qalam"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.11"
base64 = "0.22.1"
serde_json = "1.0.151"

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_Graphics_Dwm",
    "Win32_Networking_WinHttp",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = "thin"
strip = true
